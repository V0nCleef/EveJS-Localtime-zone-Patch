name: Validate release package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tools -p "test_release.py" -v
      - run: python tools/release.py --out dist
      - run: python tools/release.py --out dist --verify
      - if: github.ref_type == 'tag'
        run: python tools/release.py --tag "$GITHUB_REF_NAME" --out dist --verify
